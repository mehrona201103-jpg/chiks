<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chikstagram Admin</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #0b0b0c; --bg2: #141416; --card: #1a1a1e; --line: #2a2a30;
    --text: #f4f4f5; --muted: #9ca3af; --orange: #f59e0b; --orange2: #ea580c;
    --danger: #ff8197; --ok: #4ade80;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  a { color: var(--orange); text-decoration: none; }
  .layout { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  .sidebar { background: var(--bg2); border-right: 1px solid var(--line); padding: 20px 14px; position: sticky; top: 0; height: 100vh; }
  .sidebar h1 { font-size: 16px; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
  .sidebar nav a { display: block; padding: 10px 12px; border-radius: 10px; color: var(--muted); margin-bottom: 4px; font-size: 14px; }
  .sidebar nav a:hover, .sidebar nav a.active { background: var(--card); color: var(--text); }
  .main { padding: 24px; max-width: 1100px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .row { display: flex; gap: 12px; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .btn { border: 0; border-radius: 10px; padding: 8px 14px; font-weight: 600; cursor: pointer; background: var(--line); color: var(--text); font-size: 13px; }
  .btn:hover { filter: brightness(1.1); }
  .btn.primary { background: linear-gradient(135deg, var(--orange), var(--orange2)); color: #111; }
  .btn.danger { background: #3a1a22; color: var(--danger); }
  .btn.ok { background: #14301f; color: var(--ok); }
  .field { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--text); font-size: 14px; }
  .badge { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; background: linear-gradient(135deg,#f59e0b,#ea580c); color:#fff; font-size:11px; font-weight:800; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; background: var(--line); font-size: 12px; }
  .pill.ok { background: #14301f; color: var(--ok); }
  .pill.warn { background: #3a2a10; color: var(--orange); }
  .pill.bad { background: #3a1a22; color: var(--danger); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; }
  img.thumb { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; background: var(--bg); cursor: pointer; }
  img.thumb:hover { outline: 2px solid var(--orange); }
  .login-wrap { max-width: 380px; margin: 80px auto; }
  .login-wrap h1 { margin-bottom: 16px; }
  .login-wrap .field { margin-bottom: 10px; }
  .err { color: var(--danger); font-size: 13px; margin-top: 8px; }
  .empty { text-align: center; padding: 40px; color: var(--muted); }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .stat b { display: block; font-size: 22px; margin-top: 4px; }
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: flex; align-items: center; justify-content: center; z-index: 100; cursor: zoom-out; }
  .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 8px; }
  @media (max-width: 700px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { position: relative; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = (ts) => ts ? new Date(ts).toLocaleString('ru-RU') : '—';

let token = localStorage.getItem('chik_admin_token') || localStorage.getItem('chik_token') || '';
let me = null;

async function api(method, path, body) {
  const headers = {};
  if (token) headers.Authorization = 'Bearer ' + token;
  let payload;
  if (body instanceof FormData) payload = body;
  else if (body !== undefined) { headers['Content-Type'] = 'application/json'; payload = JSON.stringify(body); }
  const res = await fetch('/api' + path, { method, headers, body: payload });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Ошибка ' + res.status);
  return data;
}

function toast(msg, ok) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:20px;right:20px;background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:200;border:1px solid #333;' + (ok ? 'border-color:#4ade80' : '');
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}

function showImg(src) {
  const ov = document.createElement('div');
  ov.className = 'lightbox';
  ov.innerHTML = `<img src="${esc(src)}" alt="">`;
  ov.onclick = () => ov.remove();
  document.body.appendChild(ov);
}

// ---------- Login ----------
function renderLogin() {
  $('#app').innerHTML = `<div class="login-wrap card">
    <h1>✦ Admin Panel</h1>
    <p class="muted" style="margin-bottom:14px">Войдите аккаунтом администратора (CHIK_ADMINS)</p>
    <input class="field" id="login" placeholder="Никнейм или email">
    <input class="field" id="pass" type="password" placeholder="Пароль">
    <button class="btn primary" id="go" style="width:100%;margin-top:6px">Войти</button>
    <div class="err" id="err"></div>
  </div>`;
  $('#go').onclick = async () => {
    try {
      const r = await api('POST', '/auth/login', { login: $('#login').value, password: $('#pass').value });
      token = r.token;
      localStorage.setItem('chik_admin_token', token);
      me = r.user;
      // проверка админа через запрос очереди
      try { await api('GET', '/admin/verification/queue'); } catch { throw new Error('Нет прав администратора. Добавьте ник в CHIK_ADMINS'); }
      renderApp();
    } catch (e) { $('#err').textContent = e.message; }
  };
}

// ---------- Main ----------
async function renderApp() {
  $('#app').innerHTML = `<div class="layout">
    <aside class="sidebar">
      <h1>✦ Admin</h1>
      <nav>
        <a href="#/" class="active" data-tab="dash">Дашборд</a>
        <a href="#/verif" data-tab="verif">Верификация</a>
        <a href="#/users" data-tab="users">Пользователи</a>
        <a href="#/monet" data-tab="monet">Монетизация</a>
      </nav>
      <div style="margin-top:30px;font-size:12px;color:var(--muted)">
        ${esc(me?.display_name || me?.username || '')}<br>
        <a href="#" id="logout" style="color:var(--danger)">Выйти</a>
      </div>
    </aside>
    <main class="main" id="content"><div class="empty">Загрузка…</div></main>
  </div>`;
  $('#logout').onclick = (e) => { e.preventDefault(); localStorage.removeItem('chik_admin_token'); token = ''; location.reload(); };
  $$('.sidebar nav a').forEach(a => a.onclick = (e) => {
    e.preventDefault();
    $$('.sidebar nav a').forEach(x => x.classList.remove('active'));
    a.classList.add('active');
    route(a.dataset.tab);
  });
  route('dash');
}

async function route(tab) {
  const c = $('#content');
  if (tab === 'dash') return renderDash(c);
  if (tab === 'verif') return renderVerif(c);
  if (tab === 'users') return renderUsers(c);
  if (tab === 'monet') return renderMonet(c);
}

async function renderDash(c) {
  c.innerHTML = `<h2 style="margin-bottom:16px">Дашборд</h2>
    <div class="stat-grid" id="stats"><div class="stat">Загрузка…</div></div>
    <div class="card"><p class="muted">Админ-панель управляет верификацией, пользователями и монетизацией. Все действия логируются на сервере. Реквизиты оплаты настраиваются в <code>server/api.js</code> (PAYMENT_REQUISITES).</p></div>`;
  try {
    const [users, verif, monet] = await Promise.all([
      api('GET', '/admin/users?limit=5'),
      api('GET', '/admin/verification/queue'),
      api('GET', '/admin/monetization/queue'),
    ]);
    $('#stats').innerHTML = `
      <div class="stat"><span class="muted">Последние пользователи</span><b>${users.length}+</b></div>
      <div class="stat"><span class="muted">Заявки на галочку</span><b>${verif.length}</b></div>
      <div class="stat"><span class="muted">Монетизация</span><b>${monet.length}</b></div>`;
  } catch (e) { c.innerHTML += `<div class="err">${esc(e.message)}</div>`; }
}

async function renderVerif(c) {
  c.innerHTML = `<h2 style="margin-bottom:16px">Очередь верификации</h2><div id="vlist"><div class="empty">Загрузка…</div></div>`;
  try {
    const list = await api('GET', '/admin/verification/queue');
    if (!list.length) {
      $('#vlist').innerHTML = '<div class="empty">Нет заявок на проверке</div>';
      return;
    }
    $('#vlist').innerHTML = list.map(r => `
      <div class="card" data-id="${r.id}">
        <div class="row" style="margin-bottom:12px">
          <div class="grow">
            <b>@${esc(r.user.username)}</b> · ${esc(r.user.display_name)}
            <div class="muted">${esc(r.user.email)} · ${fmtDate(r.created_at)}</div>
          </div>
          <span class="pill warn">${esc(r.status)}</span>
        </div>
        <div style="margin-bottom:8px"><b>ФИО:</b> ${esc(r.full_name)}</div>
        <div class="row" style="gap:10px;flex-wrap:wrap;margin-bottom:12px">
          ${r.passport_photo ? `<div><div class="muted" style="margin-bottom:4px">Паспорт</div><img class="thumb" src="${esc(r.passport_photo)}" data-full="${esc(r.passport_photo)}"></div>` : ''}
          ${r.selfie_photo ? `<div><div class="muted" style="margin-bottom:4px">Селфи</div><img class="thumb" src="${esc(r.selfie_photo)}" data-full="${esc(r.selfie_photo)}"></div>` : ''}
          ${r.receipt_photo ? `<div><div class="muted" style="margin-bottom:4px">Чек</div><img class="thumb" src="${esc(r.receipt_photo)}" data-full="${esc(r.receipt_photo)}"></div>` : '<span class="muted">Чек ещё не загружен</span>'}
        </div>
        <div class="row">
          <button class="btn ok" data-act="approve" data-id="${r.id}">Одобрить</button>
          <button class="btn danger" data-act="reject" data-id="${r.id}">Отклонить</button>
        </div>
      </div>`).join('');
    $$('.thumb', c).forEach(img => img.onclick = () => showImg(img.dataset.full));
    $$('[data-act=approve]', c).forEach(btn => btn.onclick = async () => {
      if (!confirm('Одобрить и выдать галочку?')) return;
      try {
        await api('POST', '/admin/verification/' + btn.dataset.id, { action: 'approve' });
        toast('Одобрено', true);
        renderVerif(c);
      } catch (e) { toast(e.message); }
    });
    $$('[data-act=reject]', c).forEach(btn => btn.onclick = async () => {
      const reason = prompt('Причина отказа:', 'Документы нечитаемы / не соответствуют');
      if (reason === null) return;
      try {
        await api('POST', '/admin/verification/' + btn.dataset.id, { action: 'reject', reason });
        toast('Отклонено');
        renderVerif(c);
      } catch (e) { toast(e.message); }
    });
  } catch (e) { $('#vlist').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

async function renderUsers(c) {
  c.innerHTML = `<h2 style="margin-bottom:16px">Пользователи</h2>
    <div class="row" style="margin-bottom:12px">
      <input class="field grow" id="uq" placeholder="Поиск по нику, имени, email…">
      <button class="btn" id="usearch">Найти</button>
    </div>
    <div class="card" style="overflow:auto"><table><thead><tr>
      <th>ID</th><th>Пользователь</th><th>Email</th><th>Посты</th><th>Подп.</th><th>Статус</th><th></th>
    </tr></thead><tbody id="utbody"><tr><td colspan="7">Загрузка…</td></tr></tbody></table></div>`;
  async function load(q = '') {
    try {
      const list = await api('GET', '/admin/users?limit=80' + (q ? '&q=' + encodeURIComponent(q) : ''));
      $('#utbody').innerHTML = list.map(u => `<tr>
        <td>${u.id}</td>
        <td><b>@${esc(u.username)}</b> ${u.verified ? '<span class="badge">✓</span>' : ''}<div class="muted">${esc(u.display_name)}</div></td>
        <td class="muted">${esc(u.email)}</td>
        <td>${u.posts}</td>
        <td>${u.followers}</td>
        <td>${u.verified ? '<span class="pill ok">verified</span>' : '<span class="pill">—</span>'}</td>
        <td>
          <button class="btn sm" data-act="tog-ver" data-id="${u.id}" data-v="${u.verified ? 1 : 0}">${u.verified ? 'Снять ✓' : 'Выдать ✓'}</button>
        </td>
      </tr>`).join('') || '<tr><td colspan="7" class="empty">Никого не найдено</td></tr>';
      $$('[data-act=tog-ver]', c).forEach(btn => btn.onclick = async () => {
        try {
          await api('POST', '/admin/users/' + btn.dataset.id + '/verify', { verified: btn.dataset.v !== '1' });
          toast('Обновлено', true);
          load($('#uq').value);
        } catch (e) { toast(e.message); }
      });
    } catch (e) { $('#utbody').innerHTML = `<tr><td colspan="7" class="err">${esc(e.message)}</td></tr>`; }
  }
  $('#usearch').onclick = () => load($('#uq').value);
  $('#uq').onkeydown = (e) => { if (e.key === 'Enter') load($('#uq').value); };
  load();
}

async function renderMonet(c) {
  c.innerHTML = `<h2 style="margin-bottom:16px">Очередь монетизации</h2><div id="mlist"><div class="empty">Загрузка…</div></div>`;
  try {
    const list = await api('GET', '/admin/monetization/queue');
    if (!list.length) { $('#mlist').innerHTML = '<div class="empty">Пусто</div>'; return; }
    $('#mlist').innerHTML = list.map(u => `
      <div class="card row">
        <div class="grow">
          <b>@${esc(u.username)}</b> ${u.verified ? '<span class="badge">✓</span>' : ''}
          <div class="muted">${u.followers} подп. · ${u.posts} постов · ${u.views_30d} просм. · ${fmtDate(u.applied_at)}</div>
        </div>
        <button class="btn ok" data-id="${u.id}" data-act="m-ok">Активировать</button>
        <button class="btn danger" data-id="${u.id}" data-act="m-no">Отклонить</button>
      </div>`).join('');
    $$('[data-act=m-ok]', c).forEach(b => b.onclick = async () => {
      try { await api('POST', '/admin/users/' + b.dataset.id + '/monetization', { status: 'active' }); toast('Активировано', true); renderMonet(c); } catch (e) { toast(e.message); }
    });
    $$('[data-act=m-no]', c).forEach(b => b.onclick = async () => {
      try { await api('POST', '/admin/users/' + b.dataset.id + '/monetization', { status: 'rejected' }); toast('Отклонено'); renderMonet(c); } catch (e) { toast(e.message); }
    });
  } catch (e) { $('#mlist').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

// boot
(async () => {
  if (!token) return renderLogin();
  try {
    // проверим что токен живой и админский
    await api('GET', '/admin/verification/queue');
    // получим себя
    const meData = await api('GET', '/me').catch(() => null);
    me = meData;
    renderApp();
  } catch {
    token = '';
    localStorage.removeItem('chik_admin_token');
    renderLogin();
  }
})();
</script>
</body>
</html>
